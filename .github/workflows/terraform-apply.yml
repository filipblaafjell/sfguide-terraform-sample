name: Terraform Apply

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**.tf'
      - '**.tfvars'
      - '.github/workflows/terraform-*.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: '1.14.3'

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Create terraform.tfvars from secrets
        run: |
          cat > terraform.tfvars << EOF
          organization_name      = "${{ secrets.SNOWFLAKE_ORG }}"
          account_name           = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
          terraform_user         = "${{ secrets.SNOWFLAKE_USER }}"
          private_key_path       = "/tmp/snowflake_key.p8"
          environment            = "production"
          warehouse_size         = "SMALL"
          warehouse_auto_suspend = 60
          EOF

      - name: Create private key file
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/snowflake_key.p8
          chmod 600 /tmp/snowflake_key.p8

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan

      - name: Terraform Apply
        if: github.event.inputs.action != 'destroy'
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve

      - name: Terraform Output
        if: github.event.inputs.action != 'destroy'
        id: output
        run: |
          echo "## Terraform Outputs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          terraform output >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        if: always()
        run: |
          rm -f /tmp/snowflake_key.p8
          rm -f terraform.tfvars
          rm -f tfplan

